[project]
name = "chat-app-backend"
version = "0.1.0"
description = "Real-time team chat backend (FastAPI + PostgreSQL + WebSockets)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "argon2-cffi>=23.1",
    "pyjwt>=2.10",
    "email-validator>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-xdist>=3.6",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "testcontainers[postgres]>=4.9",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.uv]
# This is an application, not a distributable library: run it from the source tree.
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = [
    "E", "W", "F",   # pycodestyle + pyflakes
    "I",             # isort
    "B",             # bugbear
    "UP",            # pyupgrade
    "SIM",           # simplify
    "RUF",           # ruff-specific
    "ASYNC",         # async pitfalls
    "PT",            # pytest style
    "N",             # naming
    "S",             # bandit (security)
]

ignore = [
    # Exception names come from the design docs (e.g. InvalidCredentials,
    # RefreshSuperseded in docs/milestones/M02, InvariantViolation in 04 §8.3).
    "N818",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",  # assert is the point of a test
    "S105", "S106",  # fixed fake secrets are test data
    "ASYNC109",  # test helpers take an explicit timeout for readability
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# asyncpg ships no type information; only the outbox listener uses it directly.
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
    "real_commits: the test really commits; tables are truncated afterwards (docs/design/11 §21.3)",
    "slow: takes several seconds (e.g. seeds large tables); deselect with -m 'not slow'",
]
