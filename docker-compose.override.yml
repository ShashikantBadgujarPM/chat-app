# Development overrides, loaded automatically by `docker compose`.
# For a production-like run, use: docker compose -f docker-compose.yml up

services:
  db:
    ports:
      - "5432:5432"

  api:
    build:
      target: dev
    command:
      - uvicorn
      - app.main:app
      - --host=0.0.0.0
      - --port=8000
      - --workers=1
      - --ws-ping-interval=20
      - --ws-ping-timeout=20
      - --reload
    environment:
      # Bind mounts from a Windows/macOS host don't deliver inotify events reliably.
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./backend/app:/app/app
      - ./backend/tests:/app/tests
    ports:
      - "8000:8000"

  web:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
    volumes:
      - ./frontend:/app
      # Keep the container's node_modules separate from the host's.
      - web_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  web_node_modules:
